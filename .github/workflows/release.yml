# Construit automatiquement l'installateur Windows et le publie dans les Releases
# chaque fois qu'un tag de version (ex. v1.0.1) est poussé sur GitHub.
name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # permet aussi de lancer le build à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur et la version portable
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Conserver les fichiers construits (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: sequence-windows
          path: dist/*.exe

      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
